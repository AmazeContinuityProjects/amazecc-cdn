name: Faculty Sync & Master Build

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Manual trigger
    inputs:
      upload_to_kv:
        description: "Upload to Cloudflare KV"
        required: false
        default: "false"
      upload_profiles:
        description: "Upload individual profile batches"
        required: false
        default: "false"

concurrency:
  group: faculty-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Authenticate wrangler
        if: secrets.CLOUDFLARE_API_TOKEN != ''
        run: |
          echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | npx wrangler auth login --token

      - name: Run faculty master constructor (sync + build)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd scripts/faculty_master_constructor
          if [ "${{ github.event.inputs.upload_to_kv }}" = "true" ]; then
            python run.py run --upload-to-kv
          else
            python run.py run
          fi

      - name: Upload artifacts (generated JSONs)
        uses: actions/upload-artifact@v4
        with:
          name: faculty-artifacts
          path: scripts/faculty_master_constructor/artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload state snapshots (for restore history)
        uses: actions/upload-artifact@v4
        with:
          name: faculty-state
          path: scripts/faculty_master_constructor/sync/state/
          retention-days: 30
          if-no-files-found: warn

      - name: Print summary
        run: |
          echo "=== Faculty Sync Complete ==="
          echo "Artifacts: scripts/faculty_master_constructor/artifacts/"
          echo "State: scripts/faculty_master_constructor/sync/state/"
          if [ "${{ github.event.inputs.upload_to_kv }}" = "true" ]; then
            echo "KV upload: attempted"
          else
            echo "KV upload: skipped (set upload_to_kv=true to enable)"
          fi
